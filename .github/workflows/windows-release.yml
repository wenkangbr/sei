name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - name: Check version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag does not match package.json version $version" }
      - name: Install dependencies
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
        run: npm ci
      - name: Check and build
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/update-source.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'release/latest.yml')) { throw 'Missing Windows update metadata' }
          if (!(Get-ChildItem 'release/*.exe')) { throw 'Missing Windows installer' }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
