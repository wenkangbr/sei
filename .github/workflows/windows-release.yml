name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag does not match package.json version $version" }
      - name: Install dependencies
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
        run: npm ci
      - name: Check and build
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/update-source.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $feed = if ($version.Contains('-')) { 'beta.yml' } else { 'latest.yml' }
          if (!(Test-Path "release/$feed")) { throw "Missing Windows update metadata: $feed" }
          if (!(Get-ChildItem 'release/*.exe')) { throw 'Missing Windows installer' }
          Remove-Item 'release/builder-debug.yml' -ErrorAction SilentlyContinue
      - name: Build game packs
        shell: pwsh
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
        run: |
          node scripts/build-game-pack.mjs minecraft --platform win32 --arch x64 --out release/packs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-game-pack.mjs stardew --platform any --arch any --skip-build --out release/packs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-game-pack.mjs dontstarve --platform any --arch any --out release/packs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-game-pack-manifest.mjs release/packs --from-meta --out release/packs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/*.yml
            release/packs/sei-pack-*.zip
            release/packs/game-packs-*.json
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
