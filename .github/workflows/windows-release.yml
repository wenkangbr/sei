name: Windows release

on:
  push:
    branches:
      - 'dst-hud-test'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag does not match package.json version $version" }
      - name: Install dependencies
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
        run: npm ci
      - name: Check and build
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/update-source.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'release/latest.yml')) { throw 'Missing Windows update metadata' }
          if (!(Get-ChildItem 'release/*.exe')) { throw 'Missing Windows installer' }
      - name: Build game packs
        shell: pwsh
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
        run: |
          node scripts/build-game-pack.mjs minecraft --platform win32 --arch x64 --out release/packs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-game-pack.mjs stardew --platform any --arch any --skip-build --out release/packs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-game-pack.mjs dontstarve --platform any --arch any --out release/packs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-game-pack-manifest.mjs release/packs --from-meta --out release/packs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/packs/sei-pack-*.zip
            release/packs/game-packs-*.json
          fail_on_unmatched_files: true
      - name: Upload test build
        if: github.ref == 'refs/heads/dst-hud-test'
        uses: actions/upload-artifact@v7
        with:
          name: sei-windows-dst-hud-test
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/packs/sei-pack-*.zip
            release/packs/game-packs-*.json
          if-no-files-found: error
